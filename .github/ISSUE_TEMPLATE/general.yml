name: General feedback
description: Ideas, praise, or anything else about the beta.
title: "[Feedback] "
labels: ["feedback", "beta"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Your OS
      options: [macOS Apple Silicon, macOS Intel, Windows, Linux, Other]
    validations: { required: true }
  - type: dropdown
    id: tool
    attributes:
      label: AI tool you use most
      options: [Cursor, Claude Code, Grok Bot, Other / mixed]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Agivard version
      placeholder: "0.1.0-beta.1"
  - type: textarea
    id: happened
    attributes:
      label: Your feedback
    validations: { required: true }
