name: Wrong block / false alarm
description: Agivard asked or blocked something that looked fine.
title: "[False alarm] "
labels: ["false-alarm", "beta"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Your OS
      options: [macOS Apple Silicon, macOS Intel, Windows, Linux, Other]
    validations: { required: true }
  - type: dropdown
    id: tool
    attributes:
      label: AI tool
      options: [Cursor, Claude Code, Grok Bot, Other / mixed]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Agivard version
      placeholder: "0.1.0-beta.1"
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the command or plug-in call, and what Agivard said.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
